<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANFORD SESSION 1 - Gestion des Présences</title>
    
    <!-- Firebase LITE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-lite.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-lite.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
        
        .container { max-width: 1400px; margin: 20px auto; padding: 20px; }
        .header { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        .app-title { color: #2c3e50; margin-bottom: 5px; }
        .stats { display: flex; gap: 30px; margin: 20px 0; }
        .stat { text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; }
        
        .main { display: flex; gap: 20px; }
        .left-panel { flex: 3; }
        .right-panel { flex: 1; }
        
        .invites-container { background: white; border-radius: 10px; padding: 20px; }
        .invite-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        
        .connection-status {
            position: fixed; top: 20px; right: 20px; padding: 10px 20px; 
            background: #f39c12; color: white; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">🔄 Initialisation...</div>
    
    <div class="container">
        <div class="header">
            <h1 class="app-title">STANFORD SESSION 1</h1>
            <p>Gestion des présences professionnelles</p>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="importerFichier()">📁 IMPORTER CSV</button>
                <button onclick="exporterDonnees()">📥 EXPORTER</button>
                <button onclick="reinitialiserListe()">🗑️ RÉINITIALISER</button>
            </div>
            
            <div class="stats">
                <div class="stat">Total: <div class="stat-value" id="totalCount">0</div></div>
                <div class="stat">Présents: <div class="stat-value" id="presentCount">0</div></div>
                <div class="stat">Absents: <div class="stat-value" id="absentCount">0</div></div>
            </div>
        </div>
        
        <div class="main">
            <div class="left-panel">
                <input type="text" placeholder="Rechercher..." id="searchInput" style="width: 100%; padding: 10px; margin-bottom: 20px;">
                <div class="invites-container" id="invitesList">
                    <!-- Les invités apparaîtront ici -->
                </div>
            </div>
            
            <div class="right-panel">
                <div style="background: white; padding: 20px; border-radius: 10px;">
                    <h3>➕ AJOUT MANUEL</h3>
                    <input type="text" id="nomComplet" placeholder="Nom" style="width: 100%; padding: 10px; margin: 10px 0;">
                    <input type="text" id="entreprise" placeholder="Entreprise" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <button onclick="ajouterNouvelInvite()" style="width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px;">
                        ✅ Enregistrer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
// Code Firebase simplifié
const firebaseConfig = {
    apiKey: "AIzaSyAn21nmADgVyYWQn0WnqojVu5YRWs-FvQU",
    databaseURL: "https://stanford-presence-default-rtdb.firebaseio.com",
    projectId: "stanford-presence"
};

let database = null;
let invites = [];

function initFirebase() {
    try {
        const app = firebase.initializeApp(firebaseConfig);
        database = firebase.database(app);
        updateStatus("✅ Connecté en temps réel");
        loadFromFirebase();
    } catch (error) {
        updateStatus("🔴 Mode local");
        loadFromLocalStorage();
    }
}

function updateStatus(msg) {
    document.getElementById('connectionStatus').textContent = msg;
}

function loadFromFirebase() {
    if (!database) return;
    
    database.ref('invites').on('value', (snapshot) => {
        const data = snapshot.val();
        invites = data ? Object.values(data) : [];
        displayInvites();
    });
}

function saveToFirebase() {
    if (database) {
        database.ref('invites').set(invites);
    }
}

// Initialisation
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(initFirebase, 1000);
});

// Ajoutez ici les autres fonctions (ajouterNouvelInvite, displayInvites, etc.)
    </script>
</body>
</html>
