    <script>
// === CONFIGURATION SUPABASE AVEC VOS CLÉS ===
const SUPABASE_CONFIG = {
    // REMPLACEZ AVEC VOTRE PROJECT URL - vérifiez dans la barre d'adresse Supabase
    // Format: https://[votre-id].supabase.co
    url: 'https://tonifymideraantra-star.supabase.co',
    
    // VOTRE PUBLISHABLE KEY
    key: 'sb_publishable_B5WWj88YTnN9_bXheQBhSw_gltzjIlh'
};

// Initialiser Supabase
const supabase = window.supabase.createClient(
    SUPABASE_CONFIG.url,
    SUPABASE_CONFIG.key
);

// Variables globales
let invites = [];
let realtimeSubscription = null;

// === INITIALISATION ===
document.addEventListener('DOMContentLoaded', async function() {
    console.log('🚀 Application STANFORD - Initialisation Supabase');
    
    // Tester la connexion
    await testerConnexionSupabase();
    
    // Charger les données initiales
    await chargerDonnees();
    
    // Activer le temps réel
    activerTempsReel();
    
    // Écouteur de recherche
    document.getElementById('searchInput').addEventListener('input', chargerInvites);
    
    // Charger les paramètres
    chargerParametres();
    
    console.log('✅ Application prête avec temps réel!');
});

// === TESTER LA CONNEXION SUPABASE ===
async function testerConnexionSupabase() {
    const statusElement = document.getElementById('connectionStatus');
    
    try {
        // Test simple de connexion
        const { data, error } = await supabase
            .from('invites')
            .select('id')
            .limit(1);
        
        if (error) {
            if (error.message.includes('relation "invites" does not exist')) {
                console.warn('⚠️ Table "invites" non trouvée');
                statusElement.textContent = "⚠️ Table manquante";
                statusElement.className = "connection-status disconnected";
                
                // Proposer de créer la table
                if (confirm('La table "invites" n\'existe pas. Voulez-vous créer la table maintenant ?')) {
                    creerTableInvites();
                }
                return false;
            }
            throw error;
        }
        
        console.log('✅ Connexion Supabase réussie!');
        statusElement.textContent = "✅ Connecté à Supabase";
        statusElement.className = "connection-status connected";
        return true;
        
    } catch (error) {
        console.error('❌ Erreur connexion Supabase:', error);
        statusElement.textContent = "❌ Erreur connexion";
        statusElement.className = "connection-status disconnected";
        return false;
    }
}

// === CRÉER LA TABLE INVITES (si elle n'existe pas) ===
async function creerTableInvites() {
    console.log('🛠️ Création de la table invites...');
    
    // Ouvrir l'éditeur SQL
    const projectId = SUPABASE_CONFIG.url.split('//')[1].split('.')[0];
    window.open(`https://app.supabase.com/project/${projectId}/sql`, '_blank');
    
    // Code SQL à copier dans l'éditeur
    const sqlCode = `-- Créer la table invites pour l'application Stanford
CREATE TABLE IF NOT EXISTS invites (
  id BIGSERIAL PRIMARY KEY,
  civilite VARCHAR(10) DEFAULT 'M.',
  nom VARCHAR(255) NOT NULL,
  fonction VARCHAR(255),
  entreprise VARCHAR(255) NOT NULL,
  email VARCHAR(255),
  table_number VARCHAR(50),
  present BOOLEAN DEFAULT false,
  preinscrit BOOLEAN DEFAULT false,
  heure_arrivee VARCHAR(20),
  date_arrivee VARCHAR(20),
  created_at TIMESTAMP WITH TIME ZONE DEFAULT TIMEZONE('utc'::text, NOW()) NOT NULL,
  updated_at TIMESTAMP WITH TIME ZONE DEFAULT TIMEZONE('utc'::text, NOW()) NOT NULL
);

-- Désactiver la sécurité pour les tests
ALTER TABLE invites DISABLE ROW LEVEL SECURITY;

-- Créer un trigger pour updated_at
CREATE OR REPLACE FUNCTION update_updated_at_column()
RETURNS TRIGGER AS $$
BEGIN
    NEW.updated_at = TIMEZONE('utc'::text, NOW());
    RETURN NEW;
END;
$$ language 'plpgsql';

CREATE TRIGGER update_invites_updated_at 
    BEFORE UPDATE ON invites
    FOR EACH ROW
    EXECUTE FUNCTION update_updated_at_column();`;
    
    alert(`Copiez ce code SQL dans l'éditeur Supabase:\n\n${sqlCode}`);
}

// === CHARGER LES DONNÉES ===
async function chargerDonnees() {
    const listeElement = document.getElementById('invitesList');
    
    try {
        listeElement.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <h3>Chargement en cours...</h3>
                <p>Connexion à la base de données</p>
            </div>
        `;
        
        const { data, error } = await supabase
            .from('invites')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        // Convertir le format Supabase → format app
        invites = data.map(item => ({
            id: item.id,
            civilite: item.civilite || 'M.',
            nom: item.nom || '',
            fonction: item.fonction || '',
            entreprise: item.entreprise || '',
            email: item.email || '',
            table: item.table_number || '',
            present: item.present || false,
            preinscrit: item.preinscrit || false,
            heureArrivee: item.heure_arrivee || '',
            dateArrivee: item.date_arrivee || '',
            created_at: item.created_at
        }));
        
        console.log(`✅ ${invites.length} invités chargés`);
        
        if (invites.length === 0) {
            listeElement.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📁</div>
                    <h3>Aucun invité enregistré</h3>
                    <p>Ajoutez votre premier invité ou importez un fichier CSV</p>
                </div>
            `;
        } else {
            chargerInvites();
        }
        
        mettreAJourStats();
        
    } catch (error) {
        console.error('❌ Erreur chargement:', error);
        listeElement.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">❌</div>
                <h3>Erreur de connexion</h3>
                <p>Impossible de charger les données: ${error.message}</p>
                <button onclick="chargerDonnees()" style="margin-top: 20px; padding: 10px 20px; background: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Réessayer
                </button>
            </div>
        `;
    }
}

// === ACTIVER LE TEMPS RÉEL ===
function activerTempsReel() {
    console.log('🔔 Activation du temps réel...');
    
    // Désabonner si déjà abonné
    if (realtimeSubscription) {
        supabase.removeChannel(realtimeSubscription);
    }
    
    // S'abonner aux changements
    realtimeSubscription = supabase
        .channel('invites-realtime')
        .on(
            'postgres_changes',
            {
                event: '*',
                schema: 'public',
                table: 'invites'
            },
            async (payload) => {
                console.log('🔄 Changement temps réel:', payload);
                
                // Mettre à jour en fonction du type d'événement
                switch(payload.eventType) {
                    case 'INSERT':
                        // Ajouter le nouvel invité
                        const nouvelInvite = {
                            id: payload.new.id,
                            civilite: payload.new.civilite || 'M.',
                            nom: payload.new.nom || '',
                            fonction: payload.new.fonction || '',
                            entreprise: payload.new.entreprise || '',
                            email: payload.new.email || '',
                            table: payload.new.table_number || '',
                            present: payload.new.present || false,
                            preinscrit: payload.new.preinscrit || false,
                            heureArrivee: payload.new.heure_arrivee || '',
                            dateArrivee: payload.new.date_arrivee || '',
                            created_at: payload.new.created_at
                        };
                        
                        invites.unshift(nouvelInvite);
                        
                        // Animation pour le nouvel arrivant
                        setTimeout(() => {
                            const inviteElement = document.querySelector(`[data-id="${nouvelInvite.id}"]`);
                            if (inviteElement) {
                                inviteElement.classList.add('new-arrival');
                            }
                        }, 100);
                        break;
                        
                    case 'UPDATE':
                        // Mettre à jour l'invité existant
                        const index = invites.findIndex(i => i.id === payload.new.id);
                        if (index !== -1) {
                            invites[index] = {
                                ...invites[index],
                                civilite: payload.new.civilite || invites[index].civilite,
                                nom: payload.new.nom || invites[index].nom,
                                fonction: payload.new.fonction || invites[index].fonction,
                                entreprise: payload.new.entreprise || invites[index].entreprise,
                                email: payload.new.email || invites[index].email,
                                table: payload.new.table_number || invites[index].table,
                                present: payload.new.present !== undefined ? payload.new.present : invites[index].present,
                                preinscrit: payload.new.preinscrit !== undefined ? payload.new.preinscrit : invites[index].preinscrit,
                                heureArrivee: payload.new.heure_arrivee || invites[index].heureArrivee,
                                dateArrivee: payload.new.date_arrivee || invites[index].dateArrivee
                            };
                        }
                        break;
                        
                    case 'DELETE':
                        // Supprimer l'invité
                        invites = invites.filter(i => i.id !== payload.old.id);
                        break;
                }
                
                // Rafraîchir l'affichage
                chargerInvites();
                mettreAJourStats();
                
                // Mettre à jour le compteur en ligne
                mettreAJourCompteurEnLigne();
            }
        )
        .subscribe((status) => {
            const statusElement = document.getElementById('connectionStatus');
            if (status === 'SUBSCRIBED') {
                console.log('✅ Temps réel activé!');
                statusElement.textContent = "✅ Connecté en temps réel";
                statusElement.className = "connection-status connected";
            } else if (status === 'CHANNEL_ERROR') {
                console.warn('⚠️ Erreur canal temps réel');
                statusElement.textContent = "⚠️ Erreur temps réel";
                statusElement.className = "connection-status disconnected";
            }
        });
}

// === CHARGER LA LISTE DES INVITÉS (interface) ===
function chargerInvites() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const liste = document.getElementById('invitesList');
    
    if (invites.length === 0) {
        liste.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📁</div>
                <h3>Aucun invité enregistré</h3>
                <p>Ajoutez votre premier invité ou importez un fichier CSV</p>
            </div>
        `;
        mettreAJourStats();
        return;
    }
    
    const filtres = invites.filter(i => 
        i.nom.toLowerCase().includes(search) || 
        i.entreprise.toLowerCase().includes(search) ||
        (i.fonction && i.fonction.toLowerCase().includes(search)) ||
        (i.email && i.email.toLowerCase().includes(search)) ||
        (i.table && i.table.toLowerCase().includes(search))
    );
    
    if (filtres.length === 0) {
        liste.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h3>Aucun résultat</h3><p>Aucun invité ne correspond à votre recherche</p></div>';
        mettreAJourStats();
        return;
    }
    
    let html = '';
    filtres.forEach(invite => {
        html += `
            <div class="invite ${invite.present ? 'present' : ''}" data-id="${invite.id}">
                <div class="invite-info">
                    <div class="invite-name">${invite.civilite} ${invite.nom}</div>
                    <div class="invite-details">${invite.fonction} - ${invite.entreprise}</div>
                    ${invite.table ? `<div class="invite-table">🏷️ Table: ${invite.table}</div>` : ''}
                    ${invite.email ? `<div class="invite-email">📧 ${invite.email}</div>` : ''}
                    ${invite.present ? `<div class="invite-email">🕐 Arrivé à ${invite.heureArrivee} (${invite.dateArrivee})</div>` : ''}
                </div>
                <div class="invite-actions">
                    <button class="btn-present ${invite.present ? 'checked' : ''}" onclick="togglePresence(${invite.id})">
                        ${invite.present ? '✓' : '👤'} ${invite.present ? 'PRÉSENT' : 'MARQUER'}
                    </button>
                    <button class="btn-edit" onclick="ouvrirModalModification(${invite.id})">
                        ✏️
                    </button>
                    <button class="btn-delete" onclick="supprimerInvite(${invite.id})">
                        🗑️
                    </button>
                </div>
            </div>
        `;
    });
    
    liste.innerHTML = html;
    mettreAJourStats();
}

// === METTRE À JOUR LES STATISTIQUES ===
function mettreAJourStats() {
    const total = invites.length;
    const presents = invites.filter(i => i.present).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('presentCount').textContent = presents;
    document.getElementById('absentCount').textContent = total - presents;
}

// === AJOUTER UN NOUVEL INVITÉ ===
async function ajouterNouvelInvite() {
    const civilite = document.getElementById('civilite').value;
    const nom = document.getElementById('nomComplet').value.trim();
    const fonction = document.getElementById('fonction').value.trim();
    const entreprise = document.getElementById('entreprise').value.trim();
    const email = document.getElementById('email').value.trim();
    const table = document.getElementById('table').value.trim();
    
    if (!nom || !entreprise) {
        alert("❌ Veuillez remplir au moins le nom et l'entreprise");
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('invites')
            .insert([
                {
                    civilite: civilite,
                    nom: nom.toUpperCase(),
                    fonction: fonction || "Non spécifié",
                    entreprise: entreprise,
                    email: email || null,
                    table_number: table || null,
                    present: true,
                    preinscrit: false,
                    heure_arrivee: new Date().toLocaleTimeString('fr-FR'),
                    date_arrivee: new Date().toLocaleDateString('fr-FR')
                }
            ])
            .select();
        
        if (error) throw error;
        
        // Réinitialiser le formulaire
        document.getElementById('nomComplet').value = '';
        document.getElementById('fonction').value = '';
        document.getElementById('entreprise').value = '';
        document.getElementById('email').value = '';
        document.getElementById('table').value = '';
        
        console.log('✅ Invité ajouté:', data);
        
        // Pas besoin de recharger - le temps réel s'en chargera
        alert(`✅ ${civilite} ${nom} ajouté(e) avec succès !`);
        
    } catch (error) {
        console.error('❌ Erreur ajout:', error);
        alert(`❌ Erreur lors de l'ajout: ${error.message}`);
    }
}
