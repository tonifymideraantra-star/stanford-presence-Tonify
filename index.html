    <script>
// === CONFIGURATION SUPABASE (AVEC VOS CLÉS) ===
const SUPABASE_URL = 'https://tonifymideraantra-star.supabase.co';
const SUPABASE_KEY = 'sb_publishable_B5WWj88YTnN9_bXheQBhSw_gltzjIlh';

// Initialiser Supabase
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Variables globales
let invites = [];

// === INITIALISATION ===
document.addEventListener('DOMContentLoaded', async function() {
    console.log('🚀 Initialisation application Stanford');
    
    // Mettre à jour le statut
    document.getElementById('connectionStatus').textContent = "🔄 Connexion...";
    document.getElementById('connectionStatus').className = "connection-status disconnected";
    
    // Charger les données
    await chargerDonnees();
    
    // Activer le temps réel
    activerTempsReel();
    
    // Écouteur de recherche
    document.getElementById('searchInput').addEventListener('input', chargerInvites);
    
    // Charger les paramètres
    chargerParametres();
});

// === CHARGER LES DONNÉES ===
async function chargerDonnees() {
    const liste = document.getElementById('invitesList');
    
    try {
        // Test de connexion
        const { data, error } = await supabase
            .from('invites')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) {
            if (error.message.includes('relation "invites" does not exist')) {
                liste.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Table non trouvée</h3>
                        <p>La table "invites" n'existe pas encore</p>
                        <button onclick="creerTable()" style="margin-top: 15px; padding: 10px 20px; background: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer;">
                            Créer la table maintenant
                        </button>
                    </div>
                `;
                document.getElementById('connectionStatus').textContent = "❌ Table manquante";
                return;
            }
            throw error;
        }
        
        // Convertir le format
        invites = data.map(item => ({
            id: item.id,
            civilite: item.civilite || 'M.',
            nom: item.nom || '',
            fonction: item.fonction || '',
            entreprise: item.entreprise || '',
            email: item.email || '',
            table: item.table_number || '',
            present: item.present || false,
            preinscrit: item.preinscrit || false,
            heureArrivee: item.heure_arrivee || '',
            dateArrivee: item.date_arrivee || ''
        }));
        
        console.log(`✅ ${invites.length} invités chargés`);
        
        // Mettre à jour le statut
        document.getElementById('connectionStatus').textContent = "✅ Connecté";
        document.getElementById('connectionStatus').className = "connection-status connected";
        
        // Afficher les données
        chargerInvites();
        mettreAJourStats();
        
    } catch (error) {
        console.error('❌ Erreur chargement:', error);
        liste.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">❌</div>
                <h3>Erreur de connexion</h3>
                <p>${error.message}</p>
            </div>
        `;
        document.getElementById('connectionStatus').textContent = "❌ Erreur";
    }
}

// === CRÉER LA TABLE (fonction d'aide) ===
function creerTable() {
    const projectId = SUPABASE_URL.split('//')[1].split('.')[0];
    const sqlUrl = `https://app.supabase.com/project/${projectId}/sql`;
    
    const sqlCode = `CREATE TABLE invites (
  id BIGSERIAL PRIMARY KEY,
  civilite VARCHAR(10) DEFAULT 'M.',
  nom VARCHAR(255) NOT NULL,
  fonction VARCHAR(255),
  entreprise VARCHAR(255) NOT NULL,
  email VARCHAR(255),
  table_number VARCHAR(50),
  present BOOLEAN DEFAULT false,
  preinscrit BOOLEAN DEFAULT false,
  heure_arrivee VARCHAR(20),
  date_arrivee VARCHAR(20),
  created_at TIMESTAMP DEFAULT NOW()
);`;
    
    alert(`Ouvrez ce lien et copiez ce code SQL:\n\n${sqlUrl}\n\nCode SQL:\n${sqlCode}`);
    window.open(sqlUrl, '_blank');
}

// === ACTIVER LE TEMPS RÉEL ===
function activerTempsReel() {
    console.log('🔔 Activation temps réel...');
    
    const subscription = supabase
        .channel('invites-changes')
        .on('postgres_changes', 
            { event: '*', schema: 'public', table: 'invites' },
            async (payload) => {
                console.log('🔄 Changement temps réel:', payload);
                
                // Recharger les données
                await chargerDonnees();
                
                // Animation de notification
                const status = document.getElementById('connectionStatus');
                const originalText = status.textContent;
                status.textContent = "🔄 Mise à jour...";
                
                setTimeout(() => {
                    status.textContent = originalText;
                }, 1000);
            }
        )
        .subscribe();
    
    console.log('✅ Temps réel activé');
    return subscription;
}

// === AFFICHER LA LISTE DES INVITÉS ===
function chargerInvites() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const liste = document.getElementById('invitesList');
    
    if (invites.length === 0) {
        liste.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📁</div>
                <h3>Aucun invité</h3>
                <p>Commencez par ajouter des invités</p>
            </div>
        `;
        return;
    }
    
    const filtres = invites.filter(i => 
        i.nom.toLowerCase().includes(search) || 
        i.entreprise.toLowerCase().includes(search) ||
        (i.fonction && i.fonction.toLowerCase().includes(search))
    );
    
    if (filtres.length === 0) {
        liste.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <h3>Aucun résultat</h3>
                <p>Aucun invité ne correspond à votre recherche</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    filtres.forEach(invite => {
        html += `
            <div class="invite ${invite.present ? 'present' : ''}" data-id="${invite.id}">
                <div class="invite-info">
                    <div class="invite-name">${invite.civilite} ${invite.nom}</div>
                    <div class="invite-details">${invite.fonction} - ${invite.entreprise}</div>
                    ${invite.table ? `<div class="invite-table">🏷️ Table: ${invite.table}</div>` : ''}
                    ${invite.email ? `<div class="invite-email">📧 ${invite.email}</div>` : ''}
                </div>
                <div class="invite-actions">
                    <button class="btn-present ${invite.present ? 'checked' : ''}" onclick="togglePresence(${invite.id})">
                        ${invite.present ? '✓' : '👤'} ${invite.present ? 'PRÉSENT' : 'PRÉSENT'}
                    </button>
                    <button class="btn-edit" onclick="ouvrirModalModification(${invite.id})">
                        ✏️
                    </button>
                    <button class="btn-delete" onclick="supprimerInvite(${invite.id})">
                        🗑️
                    </button>
                </div>
            </div>
        `;
    });
    
    liste.innerHTML = html;
}

// === METTRE À JOUR LES STATISTIQUES ===
function mettreAJourStats() {
    const total = invites.length;
    const presents = invites.filter(i => i.present).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('presentCount').textContent = presents;
    document.getElementById('absentCount').textContent = total - presents;
}

// === AJOUTER UN INVITÉ ===
async function ajouterNouvelInvite() {
    const civilite = document.getElementById('civilite').value;
    const nom = document.getElementById('nomComplet').value.trim();
    const fonction = document.getElementById('fonction').value.trim();
    const entreprise = document.getElementById('entreprise').value.trim();
    const email = document.getElementById('email').value.trim();
    const table = document.getElementById('table').value.trim();
    
    if (!nom || !entreprise) {
        alert("❌ Veuillez remplir au moins le nom et l'entreprise");
        return;
    }
    
    try {
        const { data, error } = await supabase
            .from('invites')
            .insert([
                {
                    civilite: civilite,
                    nom: nom.toUpperCase(),
                    fonction: fonction || "Non spécifié",
                    entreprise: entreprise,
                    email: email || null,
                    table_number: table || null,
                    present: true,
                    preinscrit: false,
                    heure_arrivee: new Date().toLocaleTimeString('fr-FR'),
                    date_arrivee: new Date().toLocaleDateString('fr-FR')
                }
            ]);
        
        if (error) throw error;
        
        // Réinitialiser le formulaire
        document.getElementById('nomComplet').value = '';
        document.getElementById('fonction').value = '';
        document.getElementById('entreprise').value = '';
        document.getElementById('email').value = '';
        document.getElementById('table').value = '';
        
        alert(`✅ ${civilite} ${nom} ajouté(e) avec succès !`);
        
        // Le temps réel va automatiquement recharger les données
        
    } catch (error) {
        console.error('❌ Erreur ajout:', error);
        alert('❌ Erreur: ' + error.message);
    }
}

// === MODIFIER PRÉSENCE ===
async function togglePresence(id) {
    try {
        const invite = invites.find(i => i.id === id);
        if (!invite) return;
        
        const { error } = await supabase
            .from('invites')
            .update({
                present: !invite.present,
                heure_arrivee: !invite.present ? new Date().toLocaleTimeString('fr-FR') : null,
                date_arrivee: !invite.present ? new Date().toLocaleDateString('fr-FR') : null
            })
            .eq('id', id);
        
        if (error) throw error;
        
        // Le temps réel va mettre à jour automatiquement
        
    } catch (error) {
        console.error('❌ Erreur présence:', error);
        alert('❌ Erreur: ' + error.message);
    }
}

// === OUVRIR MODAL MODIFICATION ===
function ouvrirModalModification(id) {
    const invite = invites.find(i => i.id === id);
    if (invite) {
        document.getElementById('editId').value = id;
        document.getElementById('editCivilite').value = invite.civilite;
        document.getElementById('editNom').value = invite.nom;
        document.getElementById('editFonction').value = invite.fonction;
        document.getElementById('editEntreprise').value = invite.entreprise;
        document.getElementById('editEmail').value = invite.email || '';
        document.getElementById('editTable').value = invite.table || '';
        document.getElementById('editModal').style.display = 'flex';
    }
}

// === SAUVEGARDER MODIFICATION ===
async function sauvegarderModification() {
    const id = document.getElementById('editId').value;
    
    try {
        const { error } = await supabase
            .from('invites')
            .update({
                civilite: document.getElementById('editCivilite').value,
                nom: document.getElementById('editNom').value.toUpperCase(),
                fonction: document.getElementById('editFonction').value,
                entreprise: document.getElementById('editEntreprise').value,
                email: document.getElementById('editEmail').value || null,
                table_number: document.getElementById('editTable').value || null
            })
            .eq('id', id);
        
        if (error) throw error;
        
        fermerModal();
        alert('✅ Invité modifié !');
        
    } catch (error) {
        console.error('❌ Erreur modification:', error);
        alert('❌ Erreur: ' + error.message);
    }
}

// === SUPPRIMER INVITÉ ===
async function supprimerInvite(id) {
    if (!confirm('⚠️ Supprimer cet invité ?')) return;
    
    try {
        const { error } = await supabase
            .from('invites')
            .delete()
            .eq('id', id);
        
        if (error) throw error;
        
        alert('✅ Invité supprimé !');
        
    } catch (error) {
        console.error('❌ Erreur suppression:', error);
        alert('❌ Erreur: ' + error.message);
    }
}

// === FERMER MODAL ===
function fermerModal() {
    document.getElementById('editModal').style.display = 'none';
}
