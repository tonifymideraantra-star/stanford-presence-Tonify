// === CONFIGURATION FIREBASE EXACTE (corrigée) ===
const firebaseConfig = {
    apiKey: "AIzaSyAn21nmADgVyYWQn0WnqojVu5YRWs-FvQU",
    authDomain: "stanford-presence.firebaseapp.com",
    databaseURL: "https://stanford-presence-default-rtdb.firebaseio.com",
    projectId: "stanford-presence",
    storageBucket: "stanford-presence.firebasestorage.app",
    messagingSenderId: "747558380518",
    appId: "1:747558380518:web:c8f3e4d25ffa404e68ac27"
};

// === VARIABLES GLOBALES ===
let database = null;
let invites = [];
let nextId = 1;

// === INITIALISATION FIREBASE ===
function initFirebase() {
    try {
        console.log("🚀 Initialisation Firebase...");
        
        // 1. Vérifier que Firebase est chargé
        if (typeof firebase === 'undefined') {
            throw new Error("Firebase SDK non disponible");
        }
        
        // 2. Initialiser Firebase
        const app = firebase.initializeApp(firebaseConfig);
        database = firebase.database(app);
        
        console.log("✅ Firebase initialisé avec succès!");
        
        // 3. Configurer le monitoring de connexion
        const connectedRef = database.ref(".info/connected");
        connectedRef.on("value", (snap) => {
            const statusEl = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                statusEl.textContent = "✅ Connecté à Firebase";
                statusEl.className = "connection-status connected";
                console.log("🔥 Connexion Firebase active");
                
                // Charger les données depuis Firebase
                chargerDepuisFirebase();
            } else {
                statusEl.textContent = "🔄 Connexion en cours...";
                statusEl.style.background = "#ff9800";
                console.log("⚠️ Connexion Firebase perdue");
                
                // Basculer en mode local temporaire
                chargerDonneesSauvegardees();
            }
        });
        
        // 4. Démarrer le chargement initial
        chargerDepuisFirebase();
        
        return true;
        
    } catch (error) {
        console.error("❌ Erreur d'initialisation Firebase:", error);
        document.getElementById('connectionStatus').textContent = "🔶 Mode local uniquement";
        document.getElementById('connectionStatus').style.background = "#ff9800";
        
        // Mode local de secours
        chargerDonneesSauvegardees();
        return false;
    }
}

// === FONCTIONS FIREBASE ===

// Charger les données depuis Firebase
function chargerDepuisFirebase() {
    if (!database) {
        console.log("⚠️ Firebase non disponible, chargement local");
        chargerDonneesSauvegardees();
        return;
    }
    
    console.log("🔄 Chargement des données depuis Firebase...");
    
    database.ref('invites').on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (data) {
            // Convertir l'objet Firebase en tableau
            if (typeof data === 'object' && !Array.isArray(data)) {
                invites = Object.values(data);
                // S'assurer que chaque invite a un ID
                invites.forEach((invite, index) => {
                    if (!invite.id) {
                        invite.id = index + 1;
                    }
                });
            } else {
                invites = data || [];
            }
            
            // Calculer le prochain ID disponible
            if (invites.length > 0) {
                const ids = invites.map(i => i.id).filter(id => id !== undefined && id !== null);
                nextId = ids.length > 0 ? Math.max(...ids) + 1 : 1;
            } else {
                nextId = 1;
            }
            
            console.log(`✅ ${invites.length} invités chargés depuis Firebase`);
            chargerInvites();
            
            // Sauvegarder localement comme backup
            sauvegarderDonneesLocale();
        } else {
            invites = [];
            nextId = 1;
            console.log("ℹ️ Base de données Firebase vide");
            chargerInvites();
        }
    }, (error) => {
        console.error("❌ Erreur de chargement Firebase:", error);
        chargerDonneesSauvegardees();
    });
}

// Sauvegarder sur Firebase
function sauvegarderSurFirebase() {
    if (database) {
        database.ref('invites').set(invites)
            .then(() => {
                console.log("✅ Données sauvegardées sur Firebase");
                // Sauvegarder aussi localement comme backup
                sauvegarderDonneesLocale();
            })
            .catch(err => {
                console.error("❌ Erreur Firebase, sauvegarde locale:", err);
                sauvegarderDonneesLocale();
            });
    } else {
        // Mode local seulement
        sauvegarderDonneesLocale();
    }
}

// === FONCTIONS LOCALES ===

// Sauvegarde locale
function sauvegarderDonneesLocale() {
    localStorage.setItem('stanford_invites', JSON.stringify(invites));
    localStorage.setItem('stanford_nextId', nextId.toString());
    console.log("📁 Données sauvegardées localement");
}

// Charger depuis le stockage local
function chargerDonneesSauvegardees() {
    const saved = localStorage.getItem('stanford_invites');
    if (saved) {
        try {
            invites = JSON.parse(saved);
            nextId = parseInt(localStorage.getItem('stanford_nextId')) || invites.length + 1;
            chargerInvites();
            console.log(`📂 ${invites.length} invités chargés localement`);
            
            // Mettre à jour le statut
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = "🔶 Mode local (Firebase indisponible)";
            statusEl.style.background = "#ff9800";
        } catch (error) {
            console.error("❌ Erreur chargement local:", error);
            invites = [];
            nextId = 1;
        }
    }
}

// === INITIALISATION DE L'APPLICATION ===
document.addEventListener('DOMContentLoaded', function() {
    console.log("🚀 Application STANFORD initialisée");
    
    // Démarrer l'initialisation Firebase
    setTimeout(initFirebase, 1000);
    
    // Écouteur de recherche
    document.getElementById('searchInput').addEventListener('input', chargerInvites);
    
    // Charger les paramètres
    chargerParametres();
    
    // Sauvegarde automatique toutes les 30 secondes
    setInterval(() => {
        if (invites.length > 0) {
            sauvegarderSurFirebase();
        }
    }, 30000);
});

// === FONCTIONS DE GESTION DES INVITÉS ===

// Charger et afficher la liste des invités
function chargerInvites() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const liste = document.getElementById('invitesList');
    
    if (invites.length === 0) {
        liste.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📁</div>
                <h3>Aucune liste importée</h3>
                <p>Importez votre liste CSV ou ajoutez des invités manuellement</p>
            </div>
        `;
        mettreAJourStats();
        return;
    }
    
    const filtres = invites.filter(i => 
        i.nom.toLowerCase().includes(search) || 
        i.entreprise.toLowerCase().includes(search) ||
        (i.fonction && i.fonction.toLowerCase().includes(search)) ||
        (i.email && i.email.toLowerCase().includes(search))
    );
    
    if (filtres.length === 0) {
        liste.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><h3>Aucun résultat</h3></div>';
        mettreAJourStats();
        return;
    }
    
    let html = '';
    filtres.forEach(invite => {
        html += `
            <div class="invite ${invite.present ? 'present' : ''}" data-id="${invite.id}">
                <div class="invite-info">
                    <div class="invite-name">${invite.civilite} ${invite.nom}</div>
                    <div class="invite-details">${invite.fonction} - ${invite.entreprise}</div>
                    ${invite.email ? `<div class="invite-email">${invite.email}</div>` : ''}
                </div>
                <div class="invite-actions">
                    <button class="btn-present ${invite.present ? 'checked' : ''}" onclick="togglePresence(${invite.id})">
                        ${invite.present ? '✓' : '👤'} ${invite.present ? 'PRÉSENT' : 'PRÉSENT'}
                    </button>
                    <button class="btn-edit" onclick="ouvrirModalModification(${invite.id})">
                        ✏️
                    </button>
                    <button class="btn-delete" onclick="supprimerInvite(${invite.id})">
                        🗑️
                    </button>
                </div>
            </div>
        `;
    });
    
    liste.innerHTML = html;
    mettreAJourStats();
}

// Marquer présence/absence
function togglePresence(id) {
    const invite = invites.find(i => i.id === id);
    if (invite) {
        invite.present = !invite.present;
        if (invite.present) {
            invite.heureArrivee = new Date().toLocaleTimeString('fr-FR');
            invite.dateArrivee = new Date().toLocaleDateString('fr-FR');
        } else {
            invite.heureArrivee = '';
            invite.dateArrivee = '';
        }
        sauvegarderSurFirebase();
        chargerInvites();
    }
}

// Ouvrir modal modification
function ouvrirModalModification(id) {
    const invite = invites.find(i => i.id === id);
    if (invite) {
        document.getElementById('editId').value = id;
        document.getElementById('editCivilite').value = invite.civilite;
        document.getElementById('editNom').value = invite.nom;
        document.getElementById('editFonction').value = invite.fonction;
        document.getElementById('editEntreprise').value = invite.entreprise;
        document.getElementById('editEmail').value = invite.email || '';
        document.getElementById('editModal').style.display = 'flex';
    }
}

// Sauvegarder modification
function sauvegarderModification() {
    const id = parseInt(document.getElementById('editId').value);
    const invite = invites.find(i => i.id === id);
    
    if (invite) {
        invite.civilite = document.getElementById('editCivilite').value;
        invite.nom = document.getElementById('editNom').value.toUpperCase();
        invite.fonction = document.getElementById('editFonction').value;
        invite.entreprise = document.getElementById('editEntreprise').value;
        invite.email = document.getElementById('editEmail').value;
        
        sauvegarderSurFirebase();
        chargerInvites();
        fermerModal();
        alert('✅ Invité modifié avec succès !');
    }
}

// Supprimer invité
function supprimerInvite(id) {
    if (confirm('⚠️ Voulez-vous vraiment supprimer cet invité ?')) {
        invites = invites.filter(i => i.id !== id);
        sauvegarderSurFirebase();
        chargerInvites();
        alert('✅ Invité supprimé avec succès !');
    }
}

// Fermer modal
function fermerModal() {
    document.getElementById('editModal').style.display = 'none';
}

// Mettre à jour statistiques
function mettreAJourStats() {
    const total = invites.length;
    const presents = invites.filter(i => i.present).length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('presentCount').textContent = presents;
    document.getElementById('absentCount').textContent = total - presents;
}

// Ajouter nouvel invité
function ajouterNouvelInvite() {
    const civilite = document.getElementById('civilite').value;
    const nom = document.getElementById('nomComplet').value.trim();
    const fonction = document.getElementById('fonction').value.trim();
    const entreprise = document.getElementById('entreprise').value.trim();
    const email = document.getElementById('email').value.trim();
    
    if (!nom || !entreprise) {
        alert("❌ Veuillez remplir au moins le nom et l'entreprise");
        return;
    }
    
    const nouvelInvite = {
        id: nextId++,
        civilite,
        nom: nom.toUpperCase(),
        fonction: fonction || "Non spécifié",
        entreprise,
        email,
        present: true,
        preinscrit: false,
        heureArrivee: new Date().toLocaleTimeString('fr-FR'),
        dateArrivee: new Date().toLocaleDateString('fr-FR')
    };
    
    invites.push(nouvelInvite);
    
    // Réinitialiser le formulaire
    document.getElementById('nomComplet').value = '';
    document.getElementById('fonction').value = '';
    document.getElementById('entreprise').value = '';
    document.getElementById('email').value = '';
    
    sauvegarderSurFirebase();
    chargerInvites();
    alert(`✅ ${civilite} ${nom} ajouté(e) avec succès !`);
}

// IMPORTER FICHIER CSV
function importerFichier(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        traiterCSV(content);
        sauvegarderSurFirebase();
    };
    
    if (file.name.endsWith('.csv')) {
        reader.readAsText(file, 'UTF-8');
    } else {
        alert("❌ Format non supporté. Utilisez un fichier CSV.");
    }
}

// Traiter le CSV
function traiterCSV(csvText) {
    const lignes = csvText.split('\n');
    const nouveauxInvites = [];
    
    const separateur = csvText.includes(';') ? ';' : ',';
    
    for (let i = 0; i < lignes.length; i++) {
        const ligne = lignes[i].trim();
        if (!ligne || ligne.startsWith('"')) continue;
        
        const colonnes = ligne.split(separateur).map(c => c.trim().replace(/"/g, ''));
        
        if (colonnes.length >= 4) {
            const invite = {
                id: nextId++,
                civilite: colonnes[0] || "M.",
                nom: (colonnes[1] || "").toUpperCase(),
                fonction: colonnes[2] || "",
                entreprise: colonnes[3] || "",
                email: colonnes[4] || "",
                present: false,
                preinscrit: true
            };
            
            nouveauxInvites.push(invite);
        }
    }
    
    if (nouveauxInvites.length > 0) {
        invites = invites.concat(nouveauxInvites);
        sauvegarderSurFirebase();
        chargerInvites();
        alert(`✅ ${nouveauxInvites.length} invités importés avec succès !`);
    } else {
        alert("❌ Aucune donnée valide trouvée dans le fichier.");
    }
}

// Exporter données
function exporterDonnees() {
    if (invites.length === 0) {
        alert("❌ Aucun invité à exporter");
        return;
    }
    
    let csv = "Civilité;Nom;Fonction;Entreprise;Email;Pré-inscrit;Présent;Heure d'arrivée;Date\n";
    
    invites.forEach(invite => {
        csv += `"${invite.civilite}";"${invite.nom}";"${invite.fonction}";"${invite.entreprise}";"${invite.email || ''}";"${invite.preinscrit ? 'Oui' : 'Non'}";"${invite.present ? 'Oui' : 'Non'}";"${invite.heureArrivee || ''}";"${invite.dateArrivee || ''}"\n`;
    });
    
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `presences_${document.getElementById('appTitle').textContent.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    
    alert(`✅ ${invites.length} invité(s) exporté(s) !`);
}

// Réinitialiser la liste
function reinitialiserListe() {
    if (confirm("⚠️ Voulez-vous vraiment effacer toutes les données ? Cette action est irréversible.")) {
        if (database) {
            database.ref('invites').remove()
                .then(() => {
                    invites = [];
                    nextId = 1;
                    localStorage.removeItem('stanford_invites');
                    localStorage.removeItem('stanford_nextId');
                    chargerInvites();
                    alert("✅ Liste réinitialisée avec succès !");
                })
                .catch(error => {
                    console.error("❌ Erreur réinitialisation Firebase:", error);
                    invites = [];
                    nextId = 1;
                    localStorage.removeItem('stanford_invites');
                    localStorage.removeItem('stanford_nextId');
                    chargerInvites();
                    alert("✅ Liste réinitialisée (localement) !");
                });
        } else {
            invites = [];
            nextId = 1;
            localStorage.removeItem('stanford_invites');
            localStorage.removeItem('stanford_nextId');
            chargerInvites();
            alert("✅ Liste réinitialisée (localement) !");
        }
    }
}

    document.getElementById('appTitle').textContent = newName;

}

// Changer logo
function changerLogo() {
    const logoUrl = document.getElementById('logoUrl').value;
    if (logoUrl) {
        document.getElementById('appLogo').style.backgroundImage = `url('${logoUrl}')`;
        localStorage.setItem('stanford_logoUrl', logoUrl);
    }

// Changer couleur
function changerCouleur(color, save = true) {
    document.documentElement.style.setProperty('--primary-color', color);
    
    // Mettre à jour les sélections
    document.querySelectorAll('.color-option').forEach(opt => {
        opt.classList.remove('selected');
        if (opt.style.backgroundColor === color || 
            getComputedStyle(opt).backgroundColor === rgbToHex(color)) {
            opt.classList.add('selected');
        }
    });
    
    if (save) {
        localStorage.setItem('stanford_primaryColor', color);
    }
}

// Convertir RGB en Hex (fonction utilitaire)
function rgbToHex(rgb) {
    const rgbValues = rgb.match(/\d+/g);
    if (!rgbValues) return rgb;
    
    return '#' + rgbValues.map(x => {
        const hex = parseInt(x).toString(16);
        return hex.length === 1 ? '0' + hex : hex;
    }).join('');
}
