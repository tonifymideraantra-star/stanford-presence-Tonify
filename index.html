    <script>
// ============================================
// CONFIGURATION FIREBASE
// ============================================
const firebaseConfig = {
    apiKey: "AIzaSyAn21nmADgVyYWQn0WnqojVu5YRWs-FvQU",
    authDomain: "stanford-presence.firebaseapp.com",
    databaseURL: "https://stanford-presence-default-rtdb.firebaseio.com",
    projectId: "stanford-presence",
    storageBucket: "stanford-presence.firebasestorage.app",
    messagingSenderId: "747558380518",
    appId: "1:747558380518:web:c8f3e4d25ffa404e68ac27"
};

// ============================================
// VARIABLES GLOBALES
// ============================================
let database = null;
let invites = [];
let nextId = 1;
let firebaseInitialized = false;

// ============================================
// INITIALISATION FIREBASE
// ============================================
function initFirebase() {
    try {
        console.log("🚀 Initialisation de Firebase...");
        
        // Mettre à jour le statut
        updateConnectionStatus("connecting", "🔄 Connexion à Firebase...");
        
        // Vérifier que Firebase est chargé
        if (typeof firebase === 'undefined') {
            throw new Error("Firebase SDK non disponible");
        }
        
        // Initialiser Firebase
        const app = firebase.initializeApp(firebaseConfig);
        database = firebase.database(app);
        
        console.log("✅ Firebase initialisé avec succès!");
        firebaseInitialized = true;
        
        // Configurer le monitoring de connexion
        setupConnectionMonitor();
        
        // Charger les données depuis Firebase
        loadFromFirebase();
        
    } catch (error) {
        console.error("❌ Erreur d'initialisation Firebase:", error);
        updateConnectionStatus("disconnected", "🔴 Mode local uniquement");
        
        // Charger depuis le stockage local
        loadFromLocalStorage();
    }
}

// ============================================
// MONITORING DE CONNEXION
// ============================================
function setupConnectionMonitor() {
    if (!database) return;
    
    const connectedRef = database.ref(".info/connected");
    
    connectedRef.on("value", (snap) => {
        if (snap.val() === true) {
            updateConnectionStatus("connected", "✅ Connecté à Firebase");
            console.log("🔥 Connexion Firebase active - Mode temps réel");
        } else {
            updateConnectionStatus("disconnected", "🔴 Déconnecté - Mode local");
            console.log("⚠️ Connexion Firebase perdue");
        }
    });
}

// ============================================
// MISE À JOUR DU STATUT
// ============================================
function updateConnectionStatus(status, message) {
    const statusEl = document.getElementById('connectionStatus');
    
    // Supprimer toutes les classes
    statusEl.classList.remove("connected", "disconnected", "connecting");
    
    // Ajouter la classe appropriée
    statusEl.classList.add(status);
    
    // Mettre à jour le message
    const icon = status === "connected" ? "✅" : 
                 status === "connecting" ? "🔄" : "🔴";
    
    statusEl.innerHTML = `<span>${icon}</span><span>${message}</span>`;
}

// ============================================
// CHARGEMENT DES DONNÉES FIREBASE
// ============================================
function loadFromFirebase() {
    if (!database) {
        console.log("⚠️ Firebase non disponible, chargement local");
        loadFromLocalStorage();
        return;
    }
    
    console.log("🔄 Chargement des données depuis Firebase...");
    
    // Écouter les changements en temps réel
    database.ref('invites').on('value', (snapshot) => {
        const data = snapshot.val();
        
        if (data) {
            // Convertir l'objet Firebase en tableau
            if (typeof data === 'object' && !Array.isArray(data)) {
                invites = Object.values(data);
            } else {
                invites = data || [];
            }
            
            // S'assurer que tous les IDs sont des nombres
            invites.forEach((invite, index) => {
                invite.id = parseInt(invite.id) || (index + 1);
            });
            
            // Calculer le prochain ID
            if (invites.length > 0) {
                const ids = invites.map(i => i.id).filter(id => !isNaN(id));
                nextId = ids.length > 0 ? Math.max(...ids) + 1 : 1;
            } else {
                nextId = 1;
            }
            
            console.log(`✅ ${invites.length} invités chargés depuis Firebase`);
            displayInvites();
            saveToLocalStorage();
            
        } else {
            invites = [];
            nextId = 1;
            console.log("ℹ️ Base de données Firebase vide");
            displayInvites();
        }
        
    }, (error) => {
        console.error("❌ Erreur Firebase:", error);
        loadFromLocalStorage();
    });
}

// ============================================
// SAUVEGARDE SUR FIREBASE
// ============================================
function saveToFirebase() {
    if (database && firebaseInitialized) {
        database.ref('invites').set(invites)
            .then(() => {
                console.log("✅ Données sauvegardées sur Firebase");
                saveToLocalStorage();
            })
            .catch(err => {
                console.error("❌ Erreur Firebase, sauvegarde locale:", err);
                saveToLocalStorage();
            });
    } else {
        saveToLocalStorage();
    }
}

// ============================================
// GESTION DU STOCKAGE LOCAL
// ============================================
function saveToLocalStorage() {
    localStorage.setItem('stanford_invites', JSON.stringify(invites));
    localStorage.setItem('stanford_nextId', nextId.toString());
    console.log("📁 Données sauvegardées localement");
}

function loadFromLocalStorage() {
    const saved = localStorage.getItem('stanford_invites');
    if (saved) {
        try {
            invites = JSON.parse(saved);
            nextId = parseInt(localStorage.getItem('stanford_nextId')) || invites.length + 1;
            console.log(`📂 ${invites.length} invités chargés localement`);
            displayInvites();
        } catch (error) {
            console.error("❌ Erreur chargement local:", error);
            invites = [];
            nextId = 1;
            displayInvites();
        }
    }
}

// ============================================
// AFFICHAGE DES INVITÉS - EXACTEMENT COMME L'IMAGE
// ============================================
function displayInvites() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const listEl = document.getElementById('invitesList');
    
    // Si pas d'invités
    if (invites.length === 0) {
        listEl.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📁</div>
                <h3>Aucune liste importée</h3>
                <p>Importez votre liste CSV ou ajoutez des invités manuellement</p>
            </div>
        `;
        updateStats();
        return;
    }
    
    // Filtrer selon la recherche
    const filteredInvites = invites.filter(invite => {
        return (
            (invite.nom && invite.nom.toLowerCase().includes(searchTerm)) ||
            (invite.entreprise && invite.entreprise.toLowerCase().includes(searchTerm)) ||
            (invite.fonction && invite.fonction.toLowerCase().includes(searchTerm)) ||
            (invite.email && invite.email.toLowerCase().includes(searchTerm))
        );
    });
    
    // Si aucun résultat
    if (filteredInvites.length === 0) {
        listEl.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <h3>Aucun résultat trouvé</h3>
                <p>Aucun invité ne correspond à votre recherche</p>
            </div>
        `;
        updateStats();
        return;
    }
    
    // Générer le HTML - EXACTEMENT COMME L'IMAGE
    let html = '';
    filteredInvites.forEach(invite => {
        const civiliteDisplay = invite.civilite === "M." ? "Monsieur" : 
                                invite.civilite === "Mme" ? "Madame" : 
                                invite.civilite;
        
        html += `
            <div class="invite-item" data-id="${invite.id}">
                <div class="invite-info">
                    <div class="invite-name">
                        <span class="civilite">${invite.civilite} / ${civiliteDisplay}</span><br>
                        ${invite.nom}
                    </div>
                    <div class="invite-details">
                        ${invite.fonction || ''} ${invite.fonction ? '-' : ''} ${invite.entreprise}
                    </div>
                    ${invite.email ? `<div class="invite-email">${invite.email}</div>` : ''}
                </div>
                <div class="invite-actions">
                    <button class="presence-btn ${invite.present ? '' : 'absent'}" 
                            onclick="togglePresence(${invite.id})">
                        ${invite.present ? '✓' : '👤'} ${invite.present ? 'PRÉSENT' : 'PRÉSENT'}
                    </button>
                    <button class="icon-btn" onclick="openEditModal(${invite.id})">✏️</button>
                    <button class="icon-btn" onclick="deleteInvite(${invite.id})">🗑️</button>
                </div>
            </div>
        `;
    });
    
    listEl.innerHTML = html;
    updateStats();
}

// ============================================
// FONCTION DE FILTRAGE
// ============================================
function filtrerInvites() {
    displayInvites();
}

// ============================================
// MISE À JOUR DES STATISTIQUES
// ============================================
function updateStats() {
    const total = invites.length;
    const present = invites.filter(i => i.present).length;
    const absent = total - present;
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('presentCount').textContent = present;
    document.getElementById('absentCount').textContent = absent;
}

// ============================================
// TOGGLE PRÉSENCE
// ============================================
function togglePresence(id) {
    const invite = invites.find(i => i.id === id);
    if (invite) {
        invite.present = !invite.present;
        
        if (invite.present) {
            invite.heureArrivee = new Date().toLocaleTimeString('fr-FR');
            invite.dateArrivee = new Date().toLocaleDateString('fr-FR');
        } else {
            invite.heureArrivee = '';
            invite.dateArrivee = '';
        }
        
        saveToFirebase();
        displayInvites();
        
        // Notification
        showNotification(`${invite.civilite} ${invite.nom} ${invite.present ? 'marqué(e) présent(e)' : 'marqué(e) absent(e)'}`);
    }
}

// ============================================
// AJOUTER UN NOUVEL INVITÉ
// ============================================
function ajouterNouvelInvite() {
    const civilite = document.getElementById('civilite').value;
    const nom = document.getElementById('nomComplet').value.trim();
    const fonction = document.getElementById('fonction').value.trim();
    const entreprise = document.getElementById('entreprise').value.trim();
    const email = document.getElementById('email').value.trim();
    
    // Validation
    if (!nom) {
        alert("❌ Veuillez saisir le nom et prénom");
        document.getElementById('nomComplet').focus();
        return;
    }
    
    if (!entreprise) {
        alert("❌ Veuillez saisir l'entreprise");
        document.getElementById('entreprise').focus();
        return;
    }
    
    const nouvelInvite = {
        id: nextId++,
        civilite,
        nom: nom.toUpperCase(),
        fonction: fonction || "",
        entreprise,
        email,
        present: true,
        preinscrit: false,
        heureArrivee: new Date().toLocaleTimeString('fr-FR'),
        dateArrivee: new Date().toLocaleDateString('fr-FR')
    };
    
    invites.push(nouvelInvite);
    
    // Réinitialiser le formulaire
    document.getElementById('nomComplet').value = '';
    document.getElementById('fonction').value = '';
    document.getElementById('entreprise').value = '';
    document.getElementById('email').value = '';
    
    saveToFirebase();
    displayInvites();
    
    alert(`✅ ${civilite} ${nom} ajouté(e) avec succès !`);
}

// ============================================
// OUVIR MODAL DE MODIFICATION
// ============================================
function openEditModal(id) {
    const invite = invites.find(i => i.id === id);
    if (invite) {
        document.getElementById('editId').value = id;
        document.getElementById('editCivilite').value = invite.civilite;
        document.getElementById('editNom').value = invite.nom;
        document.getElementById('editFonction').value = invite.fonction || '';
        document.getElementById('editEntreprise').value = invite.entreprise;
        document.getElementById('editEmail').value = invite.email || '';
        document.getElementById('editModal').style.display = 'flex';
    }
}

// ============================================
// SAUVEGARDER MODIFICATION
// ============================================
function sauvegarderModification() {
    const id = parseInt(document.getElementById('editId').value);
    const invite = invites.find(i => i.id === id);
    
    if (invite) {
        invite.civilite = document.getElementById('editCivilite').value;
        invite.nom = document.getElementById('editNom').value.toUpperCase();
        invite.fonction = document.getElementById('editFonction').value;
        invite.entreprise = document.getElementById('editEntreprise').value;
        invite.email = document.getElementById('editEmail').value;
        
        saveToFirebase();
        displayInvites();
        fermerModal();
        alert('✅ Invité modifié avec succès !');
    }
}

// ============================================
// SUPPRIMER INVITÉ
// ============================================
function deleteInvite(id) {
    if (confirm('⚠️ Voulez-vous vraiment supprimer cet invité ?')) {
        invites = invites.filter(i => i.id !== id);
        saveToFirebase();
        displayInvites();
        alert('✅ Invité supprimé avec succès !');
    }
}

// ============================================
// FERMER MODAL
// ============================================
function fermerModal() {
    document.getElementById('editModal').style.display = 'none';
}

// ============================================
// IMPORTER CSV
// ============================================
function importerFichier(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    if (!file.name.endsWith('.csv')) {
        alert("❌ Veuillez sélectionner un fichier CSV");
        return;
    }
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        processCSV(content);
    };
    
    reader.readAsText(file, 'UTF-8');
}

// ============================================
// TRAITER CSV
// ============================================
function processCSV(csvText) {
    const lignes = csvText.split('\n');
    const nouveauxInvites = [];
    
    const separateur = csvText.includes(';') ? ';' : ',';
    
    for (let i = 0; i < lignes.length; i++) {
        const ligne = lignes[i].trim();
        if (!ligne) continue;
        
        const colonnes = ligne.split(separateur).map(c => c.trim().replace(/"/g, ''));
        
        if (colonnes.length >= 4) {
            const invite = {
                id: nextId++,
                civilite: colonnes[0] || "M.",
                nom: (colonnes[1] || "").toUpperCase(),
                fonction: colonnes[2] || "",
                entreprise: colonnes[3] || "",
                email: colonnes[4] || "",
                present: false,
                preinscrit: true
            };
            
            nouveauxInvites.push(invite);
        }
    }
    
    if (nouveauxInvites.length > 0) {
        invites = invites.concat(nouveauxInvites);
        saveToFirebase();
        displayInvites();
        alert(`✅ ${nouveauxInvites.length} invités importés avec succès !`);
    } else {
        alert("❌ Aucune donnée valide trouvée dans le fichier CSV");
    }
    
    // Réinitialiser le input file
    document.getElementById('fileInput').value = '';
}

// ============================================
// EXPORTER DONNÉES
// ============================================
function exporterDonnees() {
    if (invites.length === 0) {
        alert("❌ Aucun invité à exporter");
        return;
    }
    
    let csv = "Civilité;Nom;Fonction;Entreprise;Email;Pré-inscrit;Présent;Heure d'arrivée;Date\n";
    
    invites.forEach(invite => {
        csv += `"${invite.civilite}";"${invite.nom}";"${invite.fonction}";"${invite.entreprise}";"${invite.email || ''}";"${invite.preinscrit ? 'Oui' : 'Non'}";"${invite.present ? 'Oui' : 'Non'}";"${invite.heureArrivee || ''}";"${invite.dateArrivee || ''}"\n`;
    });
    
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `presences_stanford_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    
    alert(`✅ ${invites.length} invité(s) exporté(s) !`);
}

// ============================================
// RÉINITIALISER LISTE
// ============================================
function reinitialiserListe() {
    if (!confirm("⚠️ Voulez-vous vraiment effacer TOUTES les données ?\nCette action est irréversible.")) {
        return;
    }
    
    if (database && firebaseInitialized) {
        database.ref('invites').remove()
            .then(() => {
                invites = [];
                nextId = 1;
                localStorage.removeItem('stanford_invites');
                localStorage.removeItem('stanford_nextId');
                displayInvites();
                alert("✅ Toutes les données ont été réinitialisées !");
            })
            .catch(error => {
                console.error("❌ Erreur réinitialisation Firebase:", error);
                invites = [];
                nextId = 1;
                localStorage.removeItem('stanford_invites');
                localStorage.removeItem('stanford_nextId');
                displayInvites();
                alert("✅ Données réinitialisées localement !");
            });
    } else {
        invites = [];
        nextId = 1;
        localStorage.removeItem('stanford_invites');
        localStorage.removeItem('stanford_nextId');
        displayInvites();
        alert("✅ Données réinitialisées !");
    }
}

// ============================================
// OUVIR PARAMÈTRES
// ============================================
function ouvrirSettings() {
    alert("⚙️ Paramètres\n\nPour changer le nom de l'événement ou d'autres paramètres, cette fonctionnalité sera disponible dans la prochaine version.");
}

// ============================================
// NOTIFICATION
// ============================================
function showNotification(message, type = 'success') {
    // Créer une notification temporaire
    const notification = document.createElement('div');
    notification.textContent = message;
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: ${type === 'error' ? '#e74c3c' : '#27ae60'};
        color: white;
        border-radius: 8px;
        font-weight: 600;
        z-index: 3000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    `;
    
    document.body.appendChild(notification);
    
    // Supprimer après 3 secondes
    setTimeout(() => {
        notification.remove();
    }, 3000);
}

// INITIALISATION DE L'APPLICATION
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    console.log("🚀 Application STANFORD initialisée");
    
    // Démarrer Firebase après un délai
    setTimeout(initFirebase, 1000);
    
    // Sauvegarde automatique toutes les 30 secondes
    setInterval(() => {
        if (invites.length > 0) {
            saveToFirebase();
        }
    }, 30000);
});
